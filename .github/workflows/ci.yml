name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Matches the pin in docker-compose.prod.yml — CI should not be the only place
        # a different Postgres major has ever been tried.
        image: postgres:17.6
        env:
          POSTGRES_USER: chore
          POSTGRES_PASSWORD: chore
          POSTGRES_DB: chore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chore -d chore"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://chore:chore@localhost:5432/chore
      TEST_DATABASE_URL: postgresql+asyncpg://chore:chore@localhost:5432/chore_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
