name: chorekeeper

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: chore
      POSTGRES_PASSWORD: chore
      POSTGRES_DB: chore
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chore -d chore"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://chore:chore@db:5432/chore
      MEDIA_ROOT: /data/media
      SESSION_SECRET: dev-insecure-change-me
      LLM_VISION_BASE_URL: ${LLM_VISION_BASE_URL:-http://llm-vision:8081/v1}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
      LLM_VISION_API_KEY: ${LLM_VISION_API_KEY:-not-needed}
      TZ: America/Los_Angeles
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8088:8000"
    volumes:
      - media_data:/data/media

  worker:
    build: ./backend
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://chore:chore@db:5432/chore
      MEDIA_ROOT: /data/media
      SESSION_SECRET: dev-insecure-change-me
      LLM_VISION_BASE_URL: ${LLM_VISION_BASE_URL:-http://llm-vision:8081/v1}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
      LLM_VISION_API_KEY: ${LLM_VISION_API_KEY:-not-needed}
      TZ: America/Los_Angeles
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    command: ["python", "-m", "app.worker"]
    volumes:
      - media_data:/data/media

  # Single front door: Caddy serves the built PWA, proxies /api, owns the
  # security headers (spec §12.2). Behind the `proxy` profile for LAN device
  # tests; the Cloudflare Tunnel deployment brings it up via
  # docker-compose.tunnel.yml (see docs/remote-access.md).
  proxy:
    build: ./frontend
    profiles: ["proxy"]
    depends_on:
      - api
    ports:
      # 5173 is the HOST mapping only; inside the compose network Caddy listens on 80,
      # so the tunnel ingress must point at http://proxy:80, not :5173.
      - "5173:80"  # installable PWA + /api proxy — LAN device-test target

  # Vision LLM is an external llama-server for now (spec §7.2). Wired in Phase 4.
  # llm-vision:
  #   image: ...
  #   ports: ["8081:8081"]

volumes:
  db_data:
  media_data:
