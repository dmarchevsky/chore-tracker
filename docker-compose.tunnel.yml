# Cloudflare Tunnel deployment overlay (spec §12.2). See docs/remote-access.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
#
# Requires Compose v2.24+ for the `!override` tag. Reads these from .env:
#   CLOUDFLARE_TUNNEL_TOKEN  SESSION_SECRET  PUBLIC_BASE_URL  ALLOWED_HOSTS
#   CF_ACCESS_TEAM_DOMAIN  CF_ACCESS_AUD  CF_ACCESS_ISSUER
#
# CF_ACCESS_* are what make Google the login (spec §12.1): with them set, every /api/v1 path
# but /health, /checkin/{token} and the break-glass /auth/login needs a verified Access JWT.

services:
  # Outbound-only connection to Cloudflare's edge — the sole ingress path.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - proxy
    restart: unless-stopped

  # Bring the front door up by default in this deployment (no profile).
  proxy:
    profiles: !override []
    # :80 is the tunnel door and stays unpublished — cloudflared reaches it on the compose
    # network. :81 is the LAN door, published to the home network so a parent can reach the
    # break-glass sign-in when Cloudflare or Google is down (spec §12.1). cloudflared has no
    # route to it: its ingress names proxy:80 and nothing else.
    ports: !override ["5173:81"]
    depends_on:
      - api

  api:
    profiles: !override []
    ports: !override ["127.0.0.1:8088:8000"]   # operator + break-glass; host loopback only
    environment:
      ENVIRONMENT: prod                # HSTS on, /docs + /openapi.json off
      COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"      # believe CF-Connecting-IP behind the tunnel
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER:-}
    command: !override >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000
             --proxy-headers --forwarded-allow-ips='*'"

  worker:
    environment:
      ENVIRONMENT: prod
      SESSION_SECRET: ${SESSION_SECRET:?}

  db:
    ports: !override ["127.0.0.1:5432:5432"]
